name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build --target test --build-context mocks=./mocks -t creditflow-test backend
      - name: Lint
        run: docker run --rm creditflow-test ruff check .
      - name: Unit and API tests
        run: docker run --rm creditflow-test pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          PIPELINE_STEP_DELAY_SEC=0.3 docker compose up -d --build
          for i in $(seq 1 60); do curl -fs http://localhost:8080/api/health/ready && exit 0; sleep 3; done
          exit 1
      - name: End-to-end smoke test
        run: python3 scripts/e2e_smoke.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
